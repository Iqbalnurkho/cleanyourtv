name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['launcher/**', '.github/workflows/build-apk.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: launcher
        run: |
          if [ -x ./gradlew ]; then ./gradlew --no-daemon assembleDebug -PlauncherApplicationId=com.iqbal.tvhome; else gradle --no-daemon assembleDebug -PlauncherApplicationId=com.iqbal.tvhome; fi
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-debug
          path: launcher/app/build/outputs/apk/debug/*.apk
